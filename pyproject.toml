[project]
name = "jev-windows-agent"
version = "0.1.0"
description = "Windows UI Automation extension of arc-cua: an LLM-agnostic low-latency execution runtime for desktop computer-use agents"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "httpx[http2]>=0.28,<1",
  "rich>=13,<14",
]

[project.scripts]
jev = "jev_windows_agent.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1"]
macos = [
  "pyobjc-framework-ApplicationServices>=11",
  "pyobjc-framework-Cocoa>=11",
  "pyobjc-framework-Quartz>=11",
  "pyobjc-framework-Vision>=11",
]
windows = ["comtypes>=1.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_windows_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
